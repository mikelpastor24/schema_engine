include: package:lints/recommended.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - '**/build/**'
    - '**/.dart_tool/**'
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - public_member_api_docs
    - comment_references
    - directives_ordering
    - prefer_final_locals
